[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifier-cross-device"
version = "0.5.0"
description = "Self-contained controller and evaluation services for cross-device kernel verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2",
    "requests>=2.28",
    "safetensors>=0.4",
    "torch>=2.0",
    "uvicorn>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
vcd-agent = "agent.server:main"
vcd-evaluator = "agent.server:main"
vcd-evaluator-daemon = "deploy.agent_daemon:main"
vcd-controller = "vcd.cli:main"

[tool.setuptools.packages.find]
include = ["agent*", "deploy*", "examples*", "storage*", "vcd*"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/kernels"]
